{% extends "base.html" %}
{% block title %}Change password | Block Rock{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card"><p class="eyebrow">SECURITY</p><h1>Change your <em>password</em>.</h1><p class="auth-intro">Choose a strong, unique password to protect your Block Rock account.</p><form method="post" class="account-form" novalidate>{% csrf_token %}{{ form.non_field_errors }}<label>Current password{{ form.old_password }}{{ form.old_password.errors }}</label><label>New password{{ form.new_password1 }}{{ form.new_password1.errors }}{% if form.new_password1.help_text %}<small>{{ form.new_password1.help_text|safe }}</small>{% endif %}</label><label>Confirm new password{{ form.new_password2 }}{{ form.new_password2.errors }}</label><button class="button button-full" type="submit">Update password</button></form><p class="auth-switch"><a href="{% url 'profile' %}">← Back to profile</a></p></div></section>
{% endblock %}
