<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{% url 'home' %}" aria-label="Block Rock home"><span class="brand-mark">BR</span><span>BLOCK ROCK</span></a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-menu-toggle>Menu</button>
    <nav class="primary-nav" data-primary-nav>
      <a class="active" href="{% url 'home' %}">Home</a>
      <a href="{% url 'products' %}">Shop</a>
      <a href="{% url 'home' %}#categories">Categories</a>
      <a href="{% url 'home' %}#deals">Deals</a>
      <a href="{% url 'home' %}#about">About</a>
      <a href="#footer">Contact</a>
    </nav>
    <div class="nav-actions">
      <a href="#footer" class="desktop-link">Track order</a>
      {% if user.is_authenticated %}
        <a class="desktop-link" href="{% url 'account' %}">Hi, {{ user.first_name|default:user.username }}</a>
        <a class="desktop-link" href="{% url 'profile' %}">Profile</a>
        <a class="desktop-link" href="{% url 'account' %}#orders">Orders</a>
        <a href="{% url 'wishlist_detail' %}" aria-label="Wishlist">Wishlist</a>
        <a href="{% url 'cart_detail' %}" class="nav-cart" aria-label="Cart">Cart{% if cart_count %}<b>{{ cart_count }}</b>{% endif %}</a>
        <form class="logout-form" action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="nav-logout" type="submit">Logout</button>
        </form>
      {% else %}
        <a class="desktop-link" href="{% url 'register' %}">Register</a>
        <a class="button button-small" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Sign in</a>
      {% endif %}
    </div>
  </div>
</header>
